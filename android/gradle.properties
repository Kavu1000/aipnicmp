org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:\\Temp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Why jdk.net.unixdomain.tmpdir is set above
# -----------------------------------------
# Gradle's daemon needs Selector.open(), which on Windows builds an internal
# pipe over an AF_UNIX socket placed in java.io.tmpdir. On a machine whose
# temp path contains a space — "C:\Users\Acer Nitro 5\AppData\Local\Temp" —
# that connect() fails with "Invalid argument", and Gradle reports only
# "Unable to establish loopback connection" with no hint of the cause.
#
# Pointing the AF_UNIX socket at a short, space-free directory fixes it.
# C:\Temp must exist; create it with `mkdir C:\Temp` if a fresh checkout
# fails to start the daemon.
#
# Harmless on Linux and macOS, where the property is ignored.
