name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are worth cancelling; pushes to main are not.
  # Two pushes in quick succession queue, and the second to *start* cancelled
  # the first to start — which happened to be the newer commit, leaving main
  # with no images built from its head.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests

      # Runs against in-memory SQLite — no database service needed. The
      # migrations are exercised separately in the `migrations` job.
      - name: Tests
        working-directory: backend
        run: pytest -q

  migrations:
    name: Migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aipnicmp
          POSTGRES_PASSWORD: aipnicmp
          POSTGRES_DB: aipnicmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Stock postgres:16, exactly like db2.chax.site — which is the point.
      # Migration 0002 must skip the PostGIS geometry column rather than fail.
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aipnicmp:aipnicmp@localhost:5432/aipnicmp
          DATABASE_URL_SYNC: postgresql+psycopg://aipnicmp:aipnicmp@localhost:5432/aipnicmp
        run: alembic upgrade head

      - name: Roll all the way back and forward again
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aipnicmp:aipnicmp@localhost:5432/aipnicmp
          DATABASE_URL_SYNC: postgresql+psycopg://aipnicmp:aipnicmp@localhost:5432/aipnicmp
        run: |
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # The image is built with `web` as its Docker context, so an import
      # reaching outside it passes here — the checkout has the whole repo —
      # and fails minutes later in the image build. Catch it in the fast job.
      - name: No imports escape the Docker context
        working-directory: web
        run: node scripts/check-imports.mjs

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

      # The config is a template rendered by envsubst at container start, so a
      # syntax error would only appear on deploy — as a site that will not come
      # up. This renders it exactly as the container does and asks nginx to
      # check it.
      - name: Validate the nginx config
        run: |
          docker run --rm             -v "$PWD/web/nginx.conf:/etc/nginx/templates/default.conf.template:ro"             -e API_UPSTREAM=http://api:8000             nginx:1.27-alpine nginx -t

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # These pin the canonical signing string against the backend's. If they
      # fail, every record the app produces would be rejected as bad_signature
      # with no other symptom.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-collector-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  images:
    name: Build and push images
    # Only after everything that could tell us the code is broken.
    needs: [backend, migrations, web, android]
    # workflow_dispatch included on purpose: without it a manual re-run could
    # never publish, which is exactly what you want after a cancelled run.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4

      # Vite copies web/public verbatim into the built site, so the APK needs
      # no Dockerfile change and a local build without it still works.
      - name: Bundle the collector APK into the site
        if: matrix.name == 'web'
        uses: actions/download-artifact@v4
        with:
          name: coverage-collector-debug
          path: web/public/download

      - name: Name the APK for download
        if: matrix.name == 'web'
        run: |
          mv web/public/download/app-debug.apk web/public/download/coverage-collector.apk
          ls -lh web/public/download/

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aipnicmp-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
