# The site, with the API behind the same origin.
#
# Cloned from client/nginx.conf and simplified by the one thing that changes:
# the API is inside this container, at a fixed address. So there is no
# `${API_UPSTREAM}` to substitute, no variable in `proxy_pass`, and therefore
# no `resolver` — nginx resolves a literal upstream once at startup, which is
# what removes the whole class of DNS failures that configuration exists to
# survive.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same origin as the site, so the session cookie needs no exception and
    # the browser sends it without CORS being involved at all.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="coverage-collector.apk"';
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
