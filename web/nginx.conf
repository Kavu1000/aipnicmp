# Rendered by the nginx image's envsubst step, so ${API_UPSTREAM} is
# substituted at container start rather than baked in at build time.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Needed because the API upstream is resolved per
    # request rather than once at startup — see the /api/ block below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression matters here: the map bundle is ~1.2 MB uncompressed, and a
    # provincial office on a slow link is exactly who this map is for.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The collector APK, published by CI alongside the site.
    #
    # Sideloading is the distribution route for the pilot — Play Store review of
    # an app requesting background location takes weeks — so partner collectors
    # need somewhere to get it. A link they can open on the phone is that
    # somewhere.
    location /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="coverage-collector.apk"';
        # A new build replaces the old one; a cached APK would quietly install
        # a stale collector.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolved through a variable on purpose.
        #
        # With a literal hostname, nginx resolves the upstream once when the
        # configuration loads and caches that address for the life of the
        # worker. Redeploying the stack gives the api container a new IP, and
        # nginx keeps sending requests to the old one — every call returns 502
        # until nginx itself is restarted, which looks like the API is down
        # when it is running perfectly well.
        #
        # A variable forces re-resolution against Docker's DNS, so a restarted
        # api container is picked up within the resolver's TTL.
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A phone uploading a fortnight of queued records over one bar of
        # signal needs longer than the default 60s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Batches of 250 records run to a few megabytes.
        client_max_body_size 32m;
    }

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves browsers pinned to
    # the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
