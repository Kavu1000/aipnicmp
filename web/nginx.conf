# Rendered by the nginx image's envsubst step, so ${API_UPSTREAM} is
# substituted at container start rather than baked in at build time.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression matters here: the map bundle is ~1.2 MB uncompressed, and a
    # provincial office on a slow link is exactly who this map is for.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A phone uploading a fortnight of queued records over one bar of
        # signal needs longer than the default 60s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Batches of 250 records run to a few megabytes.
        client_max_body_size 32m;
    }

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves browsers pinned to
    # the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
