<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SVG first, so the mark stays sharp on any display and in any tab size.
      The 32px PNG is there for browsers that still ignore SVG favicons, and
      the 180px one is what iOS uses when the map is saved to a home screen —
      which is a realistic way for a collector to open it.

      ?v= is a cache buster, and it has to be bumped whenever the artwork
      changes. These files live in public/ so Vite does not fingerprint them,
      and everything downstream caches them hard: the CDN in front of this site
      holds images for four hours, and browsers cache favicons separately from
      everything else and for far longer than that — a reload does not clear
      one. Changing the mark without changing this URL means the old icon stays
      in tabs, which is exactly what happened the first time it changed.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Tints the browser chrome on Android to the map's own green. -->
    <meta name="theme-color" content="#1f9d55" />
    <title>Internet Coverage Map — Lao PDR</title>
    <meta
      name="description"
      content="Where the internet actually works in Laos, measured on real phones."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
