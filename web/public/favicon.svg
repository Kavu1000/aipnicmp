<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Internet coverage map of Lao PDR">
  <!--
    The platform's mark, identical to the one the collector app carries on its
    launcher icon and to the chip in the sidebar: signal arcs over a location
    pin, white on the accent red. One drawing, everywhere, so a phone in a
    village and a tab on a ministry desk plainly belong to the same system.

    A tile rather than a bare glyph, because a favicon is shown against tab
    strips of any colour and white artwork alone would vanish on a light one.
  -->
  <rect width="32" height="32" rx="7" fill="#C1121F" />

  <g transform="translate(-11,-5) scale(0.5)" fill="#FFFFFF">
    <path d="M54,36c-5.5,0 -10,4.5 -10,10c0,7.5 10,20 10,20s10,-12.5 10,-20C64,40.5 59.5,36 54,36zM54,49.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5s3.5,1.6 3.5,3.5S55.9,49.5 54,49.5z" />
  </g>

  <!-- Full scale, so the strokes survive being drawn at sixteen pixels. -->
  <path d="M9,11 A9.5,9.5 0 0 1 23,11" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <path d="M5.5,7.5 A14.5,14.5 0 0 1 26.5,7.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" />
</svg>
