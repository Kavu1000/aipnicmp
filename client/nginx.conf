# Rendered by the nginx image's envsubst step, so ${API_UPSTREAM} is
# substituted at container start rather than baked in at build time.
# Cloned from ../web/nginx.conf; see that file's comments for the reasoning
# behind each block.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS by default, which is what resolves `api` inside the
    # compose network. Overridable because not every host has one: a platform
    # that runs this image as a lone container (Railway, Fly) leaves nothing
    # listening on 127.0.0.11, and every proxied request then dies in the
    # resolver instead of reaching the upstream.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The collector APK, published by CI alongside this site too — the
    # landing page's "Get the app" link (see src/components/Landing.tsx)
    # points here, and this is the site the general public actually reaches,
    # so the download belongs on this image as much as on web's.
    location /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="coverage-collector.apk"';
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # The name the *upstream* answers to, which is this site's own host only
        # when the two are served together. Pointed at a backend on another
        # domain, the browser's host is a name that backend has never heard of,
        # and a vhost or a CDN in front of it answers 403 rather than serving
        # the API.
        proxy_set_header Host ${API_HOST};
        # Send that name in the TLS handshake too, for an upstream reached over
        # https. Without it the certificate is requested for no name at all.
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
