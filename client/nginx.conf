# Rendered by the nginx image's envsubst step, so ${API_UPSTREAM} is
# substituted at container start rather than baked in at build time.
# Cloned from ../web/nginx.conf; see that file's comments for the reasoning
# behind each block.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The collector APK, published by CI alongside this site too — the
    # landing page's "Get the app" link (see src/components/Landing.tsx)
    # points here, and this is the site the general public actually reaches,
    # so the download belongs on this image as much as on web's.
    location /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="coverage-collector.apk"';
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
